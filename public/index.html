<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Industry Research Dashboard</title>
  <meta name="description" content="A source-backed, visual snapshot of any industry." />

  <!-- Fonts: Inter (UI/body) + Plus Jakarta Sans (headings/display) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe',
              500: '#7c3aed', 600: '#6d28d9', 700: '#5b21b6',
            },
          },
        },
      },
    };
  </script>

  <!-- Chart.js v4 via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <!-- Design tokens + custom component styles -->
  <style>
    :root {
      /* Categorical chart palette — harmonious, reused everywhere */
      --chart-1: #7c3aed; /* violet  */
      --chart-2: #0ea5e9; /* sky     */
      --chart-3: #10b981; /* emerald */
      --chart-4: #f59e0b; /* amber   */
      --chart-5: #f43f5e; /* rose    */
      --chart-6: #14b8a6; /* teal    */
      --chart-7: #6366f1; /* indigo  */
      --chart-8: #ec4899; /* pink    */

      /* Primary accent = indigo / violet */
      --primary: #6d28d9;
      --primary-600: #7c3aed;
      --primary-soft: #ede9fe;
      --primary-border: #ddd6fe;
      --primary-text: #5b21b6;

      /* Semantic */
      --good: #059669;
      --good-soft: #ecfdf5;
      --good-border: #a7f3d0;
      --warn: #b45309;
      --warn-soft: #fffbeb;
      --warn-border: #fde68a;
      --bad: #e11d48;
      --bad-soft: #fff1f2;
      --bad-border: #fecdd3;
      --neutral: #475569;
      --neutral-soft: #f1f5f9;
      --neutral-border: #e2e8f0;

      /* Surfaces & text */
      --page-1: #eef2ff;
      --page-2: #f8fafc;
      --card: #ffffff;
      --border: #e9edf5;
      --border-strong: #dbe2ee;
      --ink: #0f172a;
      --ink-2: #334155;
      --ink-muted: #64748b;
      --ink-hint: #94a3b8;

      --radius: 16px;
      --radius-sm: 10px;
      --shadow-sm: 0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
      --shadow-md: 0 6px 20px rgba(15,23,42,.06), 0 2px 6px rgba(15,23,42,.04);
      --shadow-lg: 0 20px 45px rgba(79,70,229,.10), 0 8px 18px rgba(15,23,42,.06);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #ede9fe 0%, rgba(237,233,254,0) 55%),
        radial-gradient(1000px 500px at 100% 0%, #e0f2fe 0%, rgba(224,242,254,0) 50%),
        linear-gradient(180deg, var(--page-1) 0%, var(--page-2) 22%);
      background-attachment: fixed;
      min-height: 100vh;
      overflow-x: hidden; /* body never scrolls sideways */
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    h1, h2, h3, .font-display { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; }

    /* Numbers line up in columns */
    .tnum, .data-table td, .data-table th, .kpi-value, .metric { font-variant-numeric: tabular-nums; }

    a { color: inherit; }

    /* ---------- Top bar ---------- */
    .topbar {
      position: sticky; top: 0; z-index: 40;
      background: rgba(255,255,255,.82);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .brandmark {
      width: 38px; height: 38px; border-radius: 11px;
      display: grid; place-items: center; color: #fff; flex-shrink: 0;
      background: linear-gradient(135deg, var(--primary-600), #4f46e5 60%, #0ea5e9);
      box-shadow: 0 6px 16px rgba(109,40,217,.35);
    }
    .searchbar {
      display: flex; align-items: center; gap: 8px;
      background: #fff; border: 1px solid var(--border-strong);
      border-radius: 12px; padding: 8px 12px; box-shadow: var(--shadow-sm);
      transition: border-color .2s, box-shadow .2s;
    }
    .searchbar:focus-within { border-color: var(--primary-border); box-shadow: 0 0 0 4px var(--primary-soft); }
    .searchbar input { border: 0; outline: 0; width: 100%; font-size: 14px; background: transparent; color: var(--ink); }
    .searchbar input::placeholder { color: var(--ink-hint); }

    /* ---------- Tabs ---------- */
    .tabbar { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
    .tabbar::-webkit-scrollbar { display: none; }
    .tab-btn {
      position: relative; white-space: nowrap; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 14px; font-size: 14px; font-weight: 600; color: var(--ink-muted);
      border: 0; background: transparent; border-bottom: 2px solid transparent;
      transition: color .18s, border-color .18s;
    }
    .tab-btn:hover { color: var(--ink-2); }
    .tab-btn.active { color: var(--primary-text); border-bottom-color: var(--primary); }
    .tab-btn .tab-icon { width: 17px; height: 17px; }

    .subtabbar { display: flex; gap: 6px; flex-wrap: wrap; }
    .subtab-btn {
      cursor: pointer; border: 1px solid var(--border-strong); background: #fff;
      color: var(--ink-muted); font-size: 13px; font-weight: 600;
      padding: 7px 13px; border-radius: 999px; transition: all .18s; white-space: nowrap;
    }
    .subtab-btn:hover { border-color: var(--primary-border); color: var(--ink-2); }
    .subtab-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(109,40,217,.25); }

    /* ---------- Cards ---------- */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow-sm);
      transition: box-shadow .3s cubic-bezier(.4,0,.2,1), transform .3s cubic-bezier(.4,0,.2,1), border-color .3s;
    }
    .card.hoverable:hover { box-shadow: var(--shadow-lg); transform: translateY(-3px); border-color: var(--primary-border); }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 18px 0; }
    .card-title { font-size: 15px; font-weight: 700; color: var(--ink); margin: 0; letter-spacing: -.01em; }
    .card-sub { font-size: 12px; color: var(--ink-hint); margin: 3px 0 0; }
    .card-body { padding: 16px 18px 18px; }

    .section-label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--primary-text); }

    /* ---------- Chips & badges ---------- */
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--primary-soft); color: var(--primary-text);
      border: 1px solid var(--primary-border); border-radius: 999px;
      padding: 6px 12px; font-size: 13px; font-weight: 600; line-height: 1.2;
    }
    .source-chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: #fff; color: var(--ink-muted);
      border: 1px solid var(--border-strong); border-radius: 999px;
      padding: 2px 8px 2px 7px; font-size: 11px; font-weight: 600;
      text-decoration: none; transition: all .16s; max-width: 100%;
    }
    .source-chip:hover { color: var(--primary-text); border-color: var(--primary-border); background: var(--primary-soft); }
    .source-chip svg { width: 11px; height: 11px; flex-shrink: 0; }
    .source-chip .src-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 700; letter-spacing: .02em;
      padding: 3px 9px; border-radius: 7px; border: 1px solid transparent; white-space: nowrap;
    }
    .badge-good { background: var(--good-soft); color: var(--good); border-color: var(--good-border); }
    .badge-warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-border); }
    .badge-bad { background: var(--bad-soft); color: var(--bad); border-color: var(--bad-border); }
    .badge-neutral { background: var(--neutral-soft); color: var(--neutral); border-color: var(--neutral-border); }
    .badge-brand { background: var(--primary-soft); color: var(--primary-text); border-color: var(--primary-border); }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* ---------- KPI ---------- */
    .kpi-value { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; letter-spacing: -.02em; line-height: 1; color: var(--ink); }
    .kpi-label { font-size: 12px; color: var(--ink-muted); font-weight: 600; }
    .metric-pill {
      display: inline-flex; align-items: baseline; gap: 6px;
      background: linear-gradient(180deg,#fff, #fafaff); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow-sm);
    }

    /* ---------- Chart boxes (guarantee no clipping) ---------- */
    .chart-box { position: relative; width: 100%; }
    .chart-box > canvas { position: absolute; inset: 0; }

    /* ---------- Legend list (custom, avoids Chart.js label clipping) ---------- */
    .legend-item { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--border); }
    .legend-item:last-child { border-bottom: 0; }
    .legend-swatch { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }

    /* ---------- Tables ---------- */
    .table-scroll { width: 100%; overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    .data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 640px; }
    .data-table thead th {
      position: sticky; top: 0; text-align: left; font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
      color: var(--ink-muted); font-weight: 700; background: #f8fafc; padding: 11px 14px; border-bottom: 1px solid var(--border-strong); white-space: nowrap;
    }
    .data-table td { padding: 12px 14px; border-bottom: 1px solid var(--border); color: var(--ink-2); vertical-align: middle; }
    .data-table tbody tr:last-child td { border-bottom: 0; }
    .data-table tbody tr:hover td { background: #faf9ff; }
    .data-table td.num, .data-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .cell-primary { font-weight: 700; color: var(--ink); }

    /* ---------- Value chain ---------- */
    .vc-track { display: flex; gap: 0; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
    .vc-stage { flex: 1 0 190px; min-width: 190px; position: relative; padding-right: 20px; }
    .vc-stage:not(:last-child)::after {
      content: ''; position: absolute; right: 6px; top: 26px; width: 12px; height: 12px;
      border-top: 2px solid var(--primary-border); border-right: 2px solid var(--primary-border);
      transform: rotate(45deg);
    }
    .vc-card { background: linear-gradient(180deg,#fff,#fbfaff); border: 1px solid var(--border); border-radius: 12px; padding: 13px 14px; height: 100%; box-shadow: var(--shadow-sm); }
    .vc-index { width: 26px; height: 26px; border-radius: 8px; background: var(--primary-soft); color: var(--primary-text); font-weight: 800; font-size: 12px; display: grid; place-items: center; }

    /* ---------- Two-column tail/head ---------- */
    .tw-item, .hw-item { display: flex; gap: 10px; padding: 11px 0; border-bottom: 1px dashed var(--border); }
    .tw-item:last-child, .hw-item:last-child { border-bottom: 0; }
    .tw-mark { color: var(--good); flex-shrink: 0; margin-top: 1px; }
    .hw-mark { color: var(--warn); flex-shrink: 0; margin-top: 1px; }

    /* ---------- YouTube ---------- */
    .yt-thumb { position: relative; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: linear-gradient(135deg, var(--chart-1), var(--chart-7)); }
    .yt-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .yt-play { position: absolute; inset: 0; display: grid; place-items: center; }
    .yt-play span { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.92); display: grid; place-items: center; box-shadow: 0 6px 16px rgba(0,0,0,.25); }
    .yt-play svg { width: 20px; height: 20px; color: var(--primary); margin-left: 2px; }

    /* ---------- Chat ---------- */
    .chat-window { border-radius: 14px; background: var(--neutral-soft, #f7f9fc); border: 1px solid var(--border); padding: 16px; }
    .chat-log { display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 78%; padding: 11px 14px; border-radius: 14px; font-size: 14px; line-height: 1.55; word-wrap: break-word; overflow-wrap: anywhere; }
    .msg.user { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: #fff; color: var(--ink-2); border: 1px solid var(--border); border-bottom-left-radius: 4px; box-shadow: var(--shadow-sm); }
    .msg.bot.typing { color: var(--ink-hint); font-style: italic; }
    /* a bot answer + its source chips, grouped and left-aligned */
    .msg-group { align-self: flex-start; display: flex; flex-direction: column; gap: 7px; max-width: 88%; }
    .msg-group .msg.bot { max-width: 100%; }
    .chat-src-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-left: 2px; }
    .chat-src-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-hint); margin-right: 2px; }
    /* suggested starter questions */
    .chat-starters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
    .chat-starters-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-hint); margin-right: 2px; }
    .chat-starter { font-size: 12.5px; font-weight: 600; color: var(--primary-text); background: var(--primary-soft); border: 1px solid var(--primary-border); border-radius: 999px; padding: 6px 13px; cursor: pointer; transition: all .16s; }
    .chat-starter:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* ---------- Not-researched-yet (Smart Input) ---------- */
    .nr-wrap { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 30px 16px 34px; max-width: 620px; margin: 0 auto; }
    .nr-icon { width: 46px; height: 46px; display: grid; place-items: center; color: var(--primary-text); background: var(--primary-soft); border: 1px solid var(--primary-border); border-radius: 14px; }
    .nr-icon svg { width: 24px; height: 24px; }
    .nr-title { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; font-size: 21px; font-weight: 800; color: var(--ink); line-height: 1.3; }
    .nr-name { color: var(--primary-text); }
    .nr-detected { font-size: 14px; color: var(--ink-2); background: var(--primary-soft); border: 1px solid var(--primary-border); border-radius: 10px; padding: 8px 14px; }
    .nr-detected b { color: var(--ink); font-weight: 700; }
    .nr-sub { font-size: 14px; color: var(--ink-hint); }
    .nr-actions { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 4px; min-height: 44px; width: 100%; }
    .nr-btn { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: #fff; background: var(--primary); border: 0; border-radius: 11px; padding: 10px 20px; cursor: pointer; box-shadow: var(--shadow-sm); transition: filter .16s; }
    .nr-btn:hover { filter: brightness(1.06); }
    .nr-back { font-size: 12.5px; font-weight: 600; color: var(--ink-hint); background: transparent; border: 0; cursor: pointer; padding: 4px; }
    .nr-back:hover { color: var(--primary-text); }
    .nr-status { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); }
    .nr-status b { color: var(--ink); font-weight: 700; }
    .nr-poll-note { font-size: 12.5px; color: var(--ink-hint); max-width: 460px; }
    .nr-spinner { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid var(--primary-border); border-top-color: var(--primary); animation: nr-spin .8s linear infinite; flex: none; }
    @keyframes nr-spin { to { transform: rotate(360deg); } }
    .nr-manual { text-align: left; width: 100%; max-width: 520px; background: var(--warn-soft); border: 1px solid var(--warn-border); border-radius: 12px; padding: 14px 16px; }
    .nr-manual-head { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--warn); margin-bottom: 6px; }
    .nr-manual-body { font-size: 13.5px; color: var(--ink-2); line-height: 1.6; }

    /* ---------- History dropdown (near the search bar) + Refresh ---------- */
    .hist-anchor { position: relative; flex-shrink: 0; }
    .history-btn { display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 13px; font-size: 13px; font-weight: 600; color: var(--ink-2); background: var(--card); border: 1px solid var(--border-strong); border-radius: 12px; cursor: pointer; transition: all .16s; white-space: nowrap; }
    .history-btn:hover, .history-btn[aria-expanded="true"] { color: var(--primary-text); border-color: var(--primary-border); background: var(--primary-soft); }
    .history-menu { position: absolute; top: calc(100% + 8px); right: 0; z-index: 60; width: min(420px, 92vw); max-height: min(70vh, 560px); overflow-y: auto; background: var(--card); border: 1px solid var(--border-strong); border-radius: 14px; box-shadow: 0 12px 34px rgba(15,23,42,.16); padding: 12px; }
    .history-menu-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 2px 4px 10px; }
    .history-menu-title { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-hint); }
    .history-menu-count { font-size: 12px; color: var(--ink-hint); font-weight: 600; }
    .hist-list { display: flex; flex-direction: column; gap: 8px; }
    .hist-loading { color: var(--ink-hint); font-size: 13px; padding: 10px 4px; }
    .hist-row { border: 1px solid var(--border); border-radius: 12px; padding: 13px 15px; background: var(--card); transition: border-color .16s, box-shadow .16s; }
    .hist-row:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
    .hist-row.hist-current { border-color: var(--primary-border); background: var(--primary-soft); }
    .hist-row-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .hist-main { min-width: 0; flex: 1 1 260px; cursor: pointer; }
    .hist-name { font-weight: 700; font-size: 15px; color: var(--ink); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .hist-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--primary-text); background: #fff; border: 1px solid var(--primary-border); border-radius: 999px; padding: 2px 7px; }
    .hist-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-hint); margin-top: 4px; }
    .hist-meta .hist-sep { color: var(--border-strong); }
    .hist-meta .hist-you { color: var(--primary-text); font-weight: 600; }
    .hist-meta .hist-mock { color: var(--warn); font-weight: 700; }
    .hist-meta .hist-dim { font-style: italic; }
    .hist-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .hist-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; border-radius: 9px; padding: 7px 12px; cursor: pointer; transition: all .16s; white-space: nowrap; }
    .hist-open { color: var(--ink-2); background: var(--card); border: 1px solid var(--border-strong); }
    .hist-open:hover { color: var(--primary-text); border-color: var(--primary-border); background: var(--primary-soft); }
    .hist-refresh { color: #fff; background: var(--primary); border: 1px solid var(--primary); }
    .hist-refresh:hover { filter: brightness(1.06); }
    .hist-refresh:disabled { cursor: default; }
    .hist-status:empty { display: none; }
    .hist-refreshing { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--ink-2); margin-top: 11px; padding-top: 11px; border-top: 1px dashed var(--border); }
    .hist-manual { display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px; color: var(--ink-2); line-height: 1.55; margin-top: 11px; padding: 10px 12px; background: var(--warn-soft); border: 1px solid var(--warn-border); border-radius: 10px; }
    .hist-manual svg { color: var(--warn); margin-top: 1px; }

    /* Refresh control in the industry header */
    .hdr-refresh { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); background: var(--card); border: 1px solid var(--border-strong); border-radius: 9px; padding: 7px 13px; cursor: pointer; transition: all .16s; }
    .hdr-refresh:hover { color: var(--primary-text); border-color: var(--primary-border); background: var(--primary-soft); }
    .hdr-refresh:disabled { cursor: default; }
    .hdr-refresh-status { width: 100%; }
    .hdr-refresh-status:empty { display: none; }
    .hdr-refresh-status .hist-refreshing, .hdr-refresh-status .hist-manual { margin-top: 14px; }

    /* ---------- Markdown (class name avoids Tailwind's `.prose`/utility space) ---------- */
    .markdown h2 { font-size: 16px; font-weight: 800; margin: 18px 0 8px; color: var(--ink); }
    .markdown h2:first-child { margin-top: 0; }
    .markdown h3 { font-size: 14px; font-weight: 700; margin: 14px 0 6px; color: var(--ink); }
    .markdown p { margin: 0 0 10px; color: var(--ink-2); line-height: 1.65; font-size: 14px; }
    .markdown ul { margin: 0 0 12px; padding-left: 20px; }
    .markdown li { margin: 4px 0; color: var(--ink-2); line-height: 1.55; font-size: 14px; }
    .markdown strong { color: var(--ink); font-weight: 700; }
    .markdown code { background: var(--neutral-soft); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; font-size: 12.5px; }

    /* ---------- Disclosure (NOT `.collapse` — that is a Tailwind visibility utility) ---------- */
    .disclosure-btn { display: flex; align-items: center; gap: 8px; width: 100%; cursor: pointer; border: 0; background: transparent; padding: 0; }
    .disclosure-body { display: none; margin-top: 14px; }
    .disclosure.open .disclosure-body { display: block; }
    .disclosure.open .disclosure-caret { transform: rotate(90deg); }
    .disclosure-caret { transition: transform .2s; color: var(--ink-muted); }

    /* ---------- Shimmer / empty ---------- */
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .shimmer { background-image: linear-gradient(90deg,#eef1f6 0%,#f6f8fb 50%,#eef1f6 100%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 8px; }
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; min-height: 160px; color: var(--ink-hint); padding: 24px; }
    .empty-state svg { width: 30px; height: 30px; opacity: .55; }

    /* ---------- Utility ---------- */
    .hidden { display: none !important; }
    .grid-auto { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .divider { height: 1px; background: var(--border); border: 0; margin: 0; }
    .fade-in { animation: fadeIn .35s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .mock-flag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-border); padding: 3px 9px; border-radius: 999px; }

    /* ---------- Freshness + coverage strip ---------- */
    .freshbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 12px; }
    .fb-chip { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--card); border: 1px solid var(--border-strong); padding: 5px 11px; border-radius: 999px; }
    .fb-chip .fb-ic { display: inline-flex; color: var(--ink-muted); }
    .fb-chip b { font-weight: 700; color: var(--ink); }
    .fb-score { color: var(--ink-hint); font-weight: 600; }
    .tabnum { font-variant-numeric: tabular-nums; }
    .fb-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .dot-fresh { background: var(--good); } .dot-aging { background: var(--warn); } .dot-stale { background: var(--bad); }
    .cov-meter { display: inline-flex; align-items: center; gap: 2px; }
    .cov-seg { width: 13px; height: 8px; border-radius: 2px; background: var(--primary-600); }
    .cov-seg.off { background: var(--border-strong); }
    .fb-gather { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--ink-muted); }
    .fb-gather .gather-label { font-weight: 600; }
    .gskel { width: 42px; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--neutral-border), var(--neutral-soft), var(--neutral-border)); background-size: 200% 100%; animation: shimmerMove 1.4s linear infinite; }
    @keyframes shimmerMove { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    .gchip { font-size: 11.5px; color: var(--ink-muted); background: var(--neutral-soft); border: 1px dashed var(--border-strong); border-radius: 6px; padding: 2px 8px; }
    .asof { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
    .asof-fresh { color: var(--good); background: var(--good-soft); border: 1px solid var(--good-border); }
    .asof-aging { color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-border); }
    .asof-stale { color: var(--bad); background: var(--bad-soft); border: 1px solid var(--bad-border); }
    .srccount { font-size: 11px; font-weight: 600; color: var(--ink-muted); background: var(--neutral-soft); border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; white-space: nowrap; }

    /* ---------- QA polish: card head, tables, legends, clamps ---------- */
    /* Page body never scrolls sideways: panels clip stray horizontal overflow,
       while nested scrollers (e.g. .table-scroll) keep their own X scroll. */
    .tab-panel { overflow-x: clip; }
    .card-head { flex-wrap: wrap; }
    .card-head-main { flex: 1 1 auto; min-width: 56%; }
    .card-head-chips { margin-left: auto; justify-content: flex-end; }
    .clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

    /* Players table: narrower min, sized company column, clamped notes */
    .data-table { min-width: 560px; }
    .data-table td.cell-company { min-width: 168px; max-width: 300px; }
    .cell-note { margin-top: 3px; font-size: 11.5px; color: var(--ink-hint); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .show-all-btn { width: 100%; margin-top: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--primary-text); background: var(--primary-soft); border: 1px solid var(--primary-border); border-radius: 10px; padding: 9px 12px; cursor: pointer; transition: background .15s; }
    .show-all-btn:hover { background: #e5ddfb; }
    .show-all-btn svg { transform: rotate(90deg); }

    /* Segments: doughnut+legend grid stacks on mobile; bar-mode source row */
    .seg-grid { display: grid; gap: 16px; align-items: center; grid-template-columns: minmax(0,200px) 1fr; }
    @media (max-width: 640px) { .seg-grid { grid-template-columns: 1fr; } }
    .legend-name { font-size: 13px; font-weight: 600; color: var(--ink-2); line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .source-chip-icon { padding: 5px; gap: 0; }
    .src-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
    .src-row-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-hint); margin-right: 2px; }

    /* ---------- Report tab (consolidated written report) ---------- */
    .report-doc { max-width: 880px; margin: 0 auto; }
    .report-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 2px 2px 16px; border-bottom: 2px solid var(--ink); }
    .report-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--primary-text); }
    .report-title { font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -.02em; color: var(--ink); margin: 6px 0 0; line-height: 1.1; }
    .report-metaline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-muted); margin-top: 9px; }
    .report-sep { color: var(--border-strong); }
    .report-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn-border); border-radius: 6px; padding: 1px 6px; }
    .report-print-btn { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: #fff; background: var(--primary); border: 0; border-radius: 10px; padding: 9px 15px; cursor: pointer; flex-shrink: 0; transition: background .15s; }
    .report-print-btn:hover { background: var(--primary-600); }
    .report-section { padding: 22px 0 6px; border-bottom: 1px solid var(--border); }
    .report-section:last-child { border-bottom: 0; }
    .report-h { font-family: 'Plus Jakarta Sans', Inter, system-ui, sans-serif; font-size: 19px; font-weight: 800; letter-spacing: -.01em; color: var(--ink); margin: 0 0 11px; }
    .report-p { font-size: 14.5px; line-height: 1.72; color: var(--ink-2); margin: 0 0 12px; max-width: 70ch; }
    .report-keynums { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
    .report-kn { display: inline-flex; flex-direction: column; gap: 1px; background: var(--primary-soft); border: 1px solid var(--primary-border); border-radius: 10px; padding: 6px 12px; }
    .report-kn-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--primary-text); }
    .report-kn-value { font-size: 15px; font-weight: 800; color: var(--ink); }
    .report-chart { margin: 8px 0 14px; }
    .report-srcrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
    .report-srcrow-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-hint); margin-right: 2px; }
    .report-src-list { margin: 4px 0 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
    .report-src-list li { font-size: 13px; }
    .report-src-list a { color: var(--primary-text); font-weight: 600; text-decoration: none; }
    .report-src-list a:hover { text-decoration: underline; }
    .report-src-url { display: block; font-size: 11px; color: var(--ink-hint); word-break: break-all; }
    @media (max-width: 640px) { .report-title { font-size: 24px; } }

    /* ---------- Print / PDF: A4, chrome hidden, clean breaks ---------- */
    @media print {
      @page { size: A4; margin: 15mm; }
      html, body { background: #fff !important; }
      .topbar, #tabbar, .subtabbar, #industry-header, footer, .no-print,
      .tab-panel:not(#panel-report) { display: none !important; }
      #panel-report { display: block !important; }
      main { max-width: none !important; margin: 0 !important; padding: 0 !important; }
      .report-doc { max-width: none !important; }
      .card { box-shadow: none !important; border: 1px solid #e5e7eb !important; }
      .report-section { break-inside: auto; page-break-inside: auto; }
      .report-h { break-after: avoid; page-break-after: avoid; }
      .report-keynums, .report-chart, .chart-box, .report-kn, .report-srcrow { break-inside: avoid; page-break-inside: avoid; }
      .report-p { orphans: 3; widows: 3; }
      .show-all-btn, .card-head-chips { display: none !important; }
      a { color: inherit !important; text-decoration: none !important; }
    }
  </style>
</head>

<body>
  <!-- ===================== TOP BAR ===================== -->
  <header class="topbar">
    <div class="max-w-[1240px] mx-auto px-4 sm:px-6">
      <div class="flex items-center gap-3 sm:gap-5 py-3">
        <div class="flex items-center gap-3 flex-shrink-0">
          <div class="brandmark">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 3v18h18" /><path d="M7 14l3-4 3 3 4-6" />
            </svg>
          </div>
          <div class="leading-tight">
            <div class="font-display font-extrabold text-[16px] sm:text-[17px] text-slate-900 tracking-tight">Industry Research</div>
            <div class="text-[11px] text-slate-400 font-medium -mt-0.5 hidden sm:block">Everything the open internet knows — one view</div>
          </div>
        </div>

        <div class="flex items-center gap-2 flex-1 min-w-0 max-w-[620px] ml-auto">
          <form id="search-form" class="searchbar flex-1 min-w-0" role="search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="search-input" type="text" placeholder="Type an industry or company…" autocomplete="off" aria-label="Search industry" />
            <kbd class="text-[10px] text-slate-400 border border-slate-200 rounded px-1.5 py-0.5 hidden sm:inline">↵</kbd>
          </form>
          <div class="hist-anchor">
            <button id="history-btn" type="button" class="history-btn" title="Recently researched" aria-haspopup="true" aria-expanded="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>
              <span class="hidden sm:inline">Recent</span>
            </button>
            <div id="history-menu" class="history-menu hidden" role="menu" aria-label="Recently researched"></div>
          </div>
        </div>
      </div>

      <!-- Primary tabs -->
      <nav class="tabbar" id="tabbar" role="tablist" aria-label="Sections"></nav>
    </div>
  </header>

  <!-- ===================== MAIN ===================== -->
  <main class="max-w-[1240px] mx-auto px-4 sm:px-6 py-6">
    <!-- Industry header strip -->
    <div id="industry-header" class="mb-5"></div>

    <!-- Tab panels -->
    <section id="panel-deep"    class="tab-panel" role="tabpanel"></section>
    <section id="panel-report"  class="tab-panel hidden" role="tabpanel"></section>
    <section id="panel-youtube" class="tab-panel hidden" role="tabpanel"></section>
    <section id="panel-reports" class="tab-panel hidden" role="tabpanel"></section>
    <section id="panel-news"    class="tab-panel hidden" role="tabpanel"></section>
    <section id="panel-chat"    class="tab-panel hidden" role="tabpanel"></section>
  </main>

  <footer class="max-w-[1240px] mx-auto px-4 sm:px-6 pb-10 pt-2">
    <div class="text-[11px] text-slate-400 flex flex-wrap items-center gap-2">
      <span>Industry Research Dashboard</span><span>·</span>
      <span id="footer-note">Scaffold with mock data</span>
    </div>
  </footer>

  <script src="./js/app.js"></script>
</body>
</html>
